alias: Nachtverhoging
description: ""
triggers:
  - trigger: time
    at: "04:45:00"
conditions:
  - condition: and
    conditions:
      - condition: numeric_state
        entity_id: sensor.temperatuur_dag_vooruitzicht
        below: 5.1
      - condition: state
        entity_id: select.ecodan_heatpump_selected_operating_mode
        state: Heat Target Temperature
actions:
  - action: climate.set_temperature
    metadata: {}
    data:
      temperature: 20.5
    target:
      entity_id: climate.ecodan_heatpump_zone_1_climate
mode: single
