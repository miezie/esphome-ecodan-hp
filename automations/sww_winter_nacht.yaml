alias: SWW op goedkope stroom in winter
description: ""
triggers:
  - trigger: time
    at: "01:00:00"
conditions:
  - condition: template
    value_template: "{{ now().month in [1,2,11,12] }}"
actions:
  - action: climate.set_temperature
    metadata: {}
    data:
      temperature: 55
    target:
      entity_id: climate.ecodan_heatpump_dhw_climate
mode: single
