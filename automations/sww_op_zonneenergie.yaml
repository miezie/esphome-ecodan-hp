alias: "SWW op zonne-energie "
description: ""
triggers:
  - trigger: time
    at: "13:00:00"
conditions:
  - condition: template
    value_template: "{{ now().month in [3,4,5,6,7,8,9,10] }}"
actions:
  - action: climate.set_temperature
    metadata: {}
    data:
      temperature: 55
    target:
      entity_id: climate.ecodan_heatpump_dhw_climate
mode: single
